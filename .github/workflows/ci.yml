name: CI

# ตรวจโค้ดทุก push และ PR เข้า main — build/typecheck ทั้ง frontend + backend
# ไม่ deploy (การ deploy อยู่ใน deploy.yml แยกต่างหาก)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate + validate
        run: |
          npx prisma generate
          npx prisma validate
      - name: Build (tsc)
        run: npm run build

  frontend:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (tsc -b + vite build)
        run: npm run build
