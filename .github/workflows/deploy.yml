name: CD - Deploy to Azure Container Apps

# CD (แยกจาก CI ใน ci.yml) — deploy เมื่อ push tag เวอร์ชัน (เช่น v0.6.0) หรือกดรันเองจากหน้า Actions
# CI (build/typecheck) จะรันทุก push/PR ใน ci.yml; ไฟล์นี้ทำหน้าที่ deploy อย่างเดียว
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag ที่จะ deploy (เช่น v0.6.0 หรือ manual-1). ปล่อยว่าง = ใช้ run number'
        required: false
        default: ''

# ค่าคงที่ของ resource (ไม่ลับ) — ดู docs/05-deployment.md
env:
  ACR_NAME: acrscoreapp6182
  RESOURCE_GROUP: rg-score-app
  CONTAINERAPP_NAME: score-app
  IMAGE_REPO: score-app
  FQDN: score-app.jollyrock-fc32fd20.southeastasia.azurecontainerapps.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # กำหนด image tag: ถ้ามาจาก git tag ใช้ชื่อ tag (v0.6.0), ถ้า manual ใช้ input หรือ run number
      - name: Resolve image tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # build image บน ACR (ฝั่ง cloud — ไม่ต้องมี docker บน runner)
      - name: Build image on ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPO:${{ steps.meta.outputs.tag }}" \
            .

      # deploy image ใหม่เข้า Container App (ไม่แตะ volume/mount เดิม)
      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ steps.meta.outputs.tag }}"

      # smoke test — รอ revision ใหม่พร้อม แล้วเช็ค health + version
      - name: Smoke test
        run: |
          echo "รอ container พร้อม..."
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/api/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "health OK"
              break
            fi
            echo "attempt $i: health=$code — รอ 10 วิ"
            sleep 10
          done
          echo "health:"; curl -sf "https://$FQDN/api/health"
          echo ""
          echo "version:"; curl -sf "https://$FQDN/api/version"
          echo ""
          # ถ้า health ไม่ 200 ให้ job fail
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/api/health")" = "200"

      - name: Done
        run: echo "✅ deployed $IMAGE_REPO:${{ steps.meta.outputs.tag }} to $CONTAINERAPP_NAME"
